<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Flappy Bird · Laboratorio</title>
<style>
  html,body{height:100%;margin:0}
  body{display:grid;place-items:center;background:#11202a;padding:12px;box-sizing:border-box;
       font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  .game{width:min(100%,400px);max-height:100%;aspect-ratio:400/640;border-radius:14px;
        overflow:hidden;box-shadow:0 18px 50px #0009}
  canvas{width:100%;height:100%;display:block;touch-action:manipulation;
         user-select:none;-webkit-user-select:none;outline:none}
</style>
</head>
<body>
<div class="game">
  <canvas id="c" width="400" height="640" tabindex="0" aria-label="Juego Flappy Bird. Pulsa espacio o toca la pantalla para volar."></canvas>
</div>
<script>
const c = document.getElementById("c");
const g = c.getContext("2d");

const W = 400, H = 640, GROUND = H - 80;
const GRAVITY = 0.42, JUMP = -7.2, SPEED = 2.4;
const GAP = 150, PIPE_W = 64, SPACING = 210;

let state, bird, pipes, score, best, frame, clouds, overAt;

function reset() {
  bird = { x: 110, y: H / 2 - 40, vy: 0, r: 16, rot: 0, wing: 0 };
  pipes = [];
  score = 0;
  frame = 0;
  clouds = Array.from({ length: 4 }, (_, i) => ({
    x: (W / 4) * i + Math.random() * 60,
    y: 50 + Math.random() * 200,
    s: 0.3 + Math.random() * 0.3
  }));
}

function flap() {
  if (state === "over") {
    if (performance.now() - overAt > 500) { state = "ready"; reset(); }
    return;
  }
  if (state === "ready") state = "playing";
  bird.vy = JUMP;
  bird.wing = 8;
}

function die() {
  if (state !== "playing") return;
  state = "over";
  overAt = performance.now();
  best = Math.max(best, score);
  bird.vy = 0;
}

function update() {
  frame++;

  // Nubes siempre se mueven suavemente; se detienen al perder.
  if (state !== "over") {
    clouds.forEach(cl => {
      cl.x -= cl.s * 0.5;
      if (cl.x < -60) { cl.x = W + 60; cl.y = 50 + Math.random() * 200; }
    });
  }

  if (state === "ready") {
    bird.y = H / 2 - 40 + Math.sin(frame / 10) * 6;
    bird.rot = 0;
  }

  if (state === "playing") {
    bird.vy += GRAVITY;
    bird.y += bird.vy;
    bird.rot = Math.max(-0.5, Math.min(1.2, bird.vy * 0.08));

    pipes.forEach(p => p.x -= SPEED);
    if (!pipes.length || pipes[pipes.length - 1].x < W - SPACING) {
      pipes.push({ x: W + 20, top: 90 + Math.random() * (GROUND - GAP - 180), passed: false });
    }
    pipes = pipes.filter(p => p.x + PIPE_W > -10);

    pipes.forEach(p => {
      if (!p.passed && p.x + PIPE_W < bird.x - bird.r) {
        p.passed = true;
        score++;
      }
    });

    // Colisiones con suelo y techo
    if (bird.y + bird.r >= GROUND) { bird.y = GROUND - bird.r; die(); }
    if (bird.y - bird.r <= 0) { bird.y = bird.r; die(); }

    // Colisiones con tubos (caja un poco más pequeña que el dibujo para ser justos)
    const hb = bird.r * 0.8;
    pipes.forEach(p => {
      const inX = bird.x + hb > p.x && bird.x - hb < p.x + PIPE_W;
      const hitsTop = bird.y - hb < p.top;
      const hitsBottom = bird.y + hb > p.top + GAP;
      if (inX && (hitsTop || hitsBottom)) die();
    });
  }

  if (state === "over") {
    bird.vy += GRAVITY;
    bird.y = Math.min(bird.y + bird.vy, GROUND - bird.r);
    bird.rot = Math.min(bird.rot + 0.08, 1.4);
  }

  if (bird.wing > 0) bird.wing--;
}

function drawCloud(x, y, s) {
  g.fillStyle = "rgba(255,255,255,0.85)";
  g.beginPath();
  g.ellipse(x, y, 36 * s, 16 * s, 0, 0, Math.PI * 2);
  g.ellipse(x + 26 * s, y - 8 * s, 26 * s, 18 * s, 0, 0, Math.PI * 2);
  g.ellipse(x - 26 * s, y - 4 * s, 22 * s, 14 * s, 0, 0, Math.PI * 2);
  g.fill();
}

function drawPipe(x, y, h, lipAtBottom) {
  // Cuerpo
  g.fillStyle = "#5aa84a";
  g.fillRect(x, y, PIPE_W, h);
  // Brillo
  g.fillStyle = "#7cc96a";
  g.fillRect(x + 8, y, 8, h);
  // Borde oscuro
  g.fillStyle = "#3d7a33";
  g.fillRect(x + PIPE_W - 6, y, 6, h);
  // Boca del tubo
  const lipY = lipAtBottom ? y + h - 26 : y;
  g.fillStyle = "#5aa84a";
  g.fillRect(x - 5, lipY, PIPE_W + 10, 26);
  g.fillStyle = "#3d7a33";
  g.fillRect(x - 5, lipY, PIPE_W + 10, 4);
  g.fillRect(x + PIPE_W + 1, lipY, 4, 26);
  g.strokeStyle = "#2b5a24";
  g.lineWidth = 2;
  g.strokeRect(x - 5, lipY, PIPE_W + 10, 26);
}

function drawBird() {
  g.save();
  g.translate(bird.x, bird.y);
  g.rotate(bird.rot);

  // Cuerpo
  g.fillStyle = "#ffc233";
  g.beginPath();
  g.ellipse(0, 0, bird.r + 2, bird.r - 1, 0, 0, Math.PI * 2);
  g.fill();
  g.strokeStyle = "#1d2a2f";
  g.lineWidth = 2;
  g.stroke();

  // Ala (sube al aletear)
  g.fillStyle = "#ffe08a";
  g.beginPath();
  g.ellipse(-4, bird.wing > 0 ? -3 : 3, 10, 5, -0.3, 0, Math.PI * 2);
  g.fill();
  g.stroke();

  // Ojo
  g.fillStyle = "#fff";
  g.beginPath();
  g.arc(6, -5, 5.5, 0, Math.PI * 2);
  g.fill();
  g.stroke();
  g.fillStyle = "#1d2a2f";
  g.beginPath();
  g.arc(8, -5, 2.5, 0, Math.PI * 2);
  g.fill();

  // Pico
  g.fillStyle = "#e4572e";
  g.beginPath();
  g.moveTo(bird.r - 2, -2);
  g.lineTo(bird.r + 10, 3);
  g.lineTo(bird.r - 2, 8);
  g.closePath();
  g.fill();
  g.stroke();

  g.restore();
}

function drawText(text, x, y, size, weight = 800) {
  g.font = `${weight} ${size}px system-ui, sans-serif`;
  g.textAlign = "center";
  g.textBaseline = "middle";
  g.lineJoin = "round";
  g.lineWidth = Math.max(4, size / 8);
  g.strokeStyle = "#1d2a2f";
  g.strokeText(text, x, y);
  g.fillStyle = "#fff";
  g.fillText(text, x, y);
}

function draw() {
  // Cielo
  const sky = g.createLinearGradient(0, 0, 0, GROUND);
  sky.addColorStop(0, "#6fc3e0");
  sky.addColorStop(1, "#d9f1f7");
  g.fillStyle = sky;
  g.fillRect(0, 0, W, H);

  clouds.forEach(cl => drawCloud(cl.x, cl.y, cl.s));

  // Tubos
  pipes.forEach(p => {
    drawPipe(p.x, 0, p.top, true);
    drawPipe(p.x, p.top + GAP, GROUND - (p.top + GAP), false);
  });

  // Suelo
  g.fillStyle = "#e6c97a";
  g.fillRect(0, GROUND, W, H - GROUND);
  g.fillStyle = "#7cbf4a";
  g.fillRect(0, GROUND, W, 14);
  g.fillStyle = "#c9a654";
  for (let x = -((frame * SPEED) % 24); x < W; x += 24) {
    g.fillRect(x, GROUND + 26, 12, 4);
  }

  drawBird();

  // Marcador
  if (state === "playing" || state === "over") {
    drawText(String(score), W / 2, 90, 56);
  }

  if (state === "ready") {
    drawText("Flappy Bird", W / 2, H * 0.28, 44);
    drawText("Pulsa espacio o toca para empezar", W / 2, H * 0.28 + 40, 16, 600);
  }

  if (state === "over") {
    g.fillStyle = "rgba(29,42,47,0.82)";
    g.fillRect(W / 2 - 130, H / 2 - 110, 260, 210);
    drawText("Game over", W / 2, H / 2 - 66, 36);
    drawText(`Puntos: ${score}`, W / 2, H / 2 - 12, 22, 700);
    drawText(`Mejor: ${best}`, W / 2, H / 2 + 22, 22, 700);
    drawText("Toca para reintentar", W / 2, H / 2 + 68, 16, 600);
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

// Controles
c.addEventListener("pointerdown", e => { e.preventDefault(); c.focus(); flap(); });
addEventListener("keydown", e => {
  if (["Space", "ArrowUp", "Enter"].includes(e.code)) {
    e.preventDefault();
    flap();
  }
});

state = "ready";
best = 0;
reset();
loop();
</script>
</body>
</html>
